# docker-compose.yml — Airflow (dev local)
#
# Executa o Airflow no modo LocalExecutor + PostgreSQL (metadados).
# O MongoDB Atlas é externo — não precisa de serviço local.
#
# Uso rápido:
#   docker-compose up airflow-init    <- inicializa DB e cria usuário admin (1x)
#   docker-compose up -d              <- sobe webserver + scheduler
#   docker-compose down               <- para tudo
#
# Airflow UI: http://localhost:8080
#   usuário: admin  |  senha: admin (gerada no airflow-init)

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"

    # Fuso horário do projeto
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Sao_Paulo

    # Python path — expõe o pacote `app` para os imports nos DAGs
    PYTHONPATH: /opt/airflow/project

    # Variáveis de ambiente do projeto (lidas pelos services via os.environ / python-dotenv)
    MONGO_URI: ${MONGO_URI}
    DB_NAME: ${DB_NAME}
    META_APP_ID: ${META_APP_ID}
    META_APP_SECRET: ${META_APP_SECRET}
    IG_APP_ID: ${IG_APP_ID}
    IG_APP_SECRET: ${IG_APP_SECRET}
    WEBHOOK_VERIFY_TOKEN: ${WEBHOOK_VERIFY_TOKEN}

    # Airflow Variable: profile_id do perfil Instagram a processar
    # Defina via UI (Admin > Variables > ig_profile_id) ou via CLI:
    #   docker-compose exec airflow-scheduler airflow variables set ig_profile_id <SEU_PROFILE_ID>
    # AIRFLOW_VAR_IG_PROFILE_ID: "34035069212804453"   # descomente para usar valor fixo

  volumes:
    # DAGs: aponta para o diretório de DAGs do projeto
    - ./app/dags:/opt/airflow/dags
    # Projeto completo: montado em /opt/airflow/project para que `from app.xxx` funcione
    - .:/opt/airflow/project
    # Logs persistidos no host
    - airflow-logs:/opt/airflow/logs

  depends_on:
    postgres:
      condition: service_healthy

services:
  # ── Banco de metadados do Airflow ──────────────────────────────────────────
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ── Inicialização do DB (roda uma vez e sai) ────────────────────────────────
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email ${AIRFLOW_ADMIN_EMAIL:-admin@socialdatalab.online} \
          --password admin
        echo "✅ Airflow inicializado. Acesse http://localhost:8080 (admin/admin)"
    restart: "no"

  # ── Webserver (UI) ──────────────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── Scheduler (agendamento e execução de tasks) ─────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped

volumes:
  postgres-db:
  airflow-logs:
